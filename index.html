
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мій чат 💬</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #d8b4fe, #93c5fd);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}
.chat {
  width: 95%;
  max-width: 430px;
  height: 600px;
  background: white;
  border-radius: 20px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 10px 35px #5555;
}
header {
  background: #8b5cf6;
  color: white;
  padding: 20px;
  text-align: center;
  font-size: 22px;
  font-weight: bold;
}
#messages {
  flex: 1;
  padding: 15px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.message {
  padding: 11px 15px;
  border-radius: 15px;
  max-width: 80%;
  overflow-wrap: anywhere;
}
.me {
  background: #8b5cf6;
  color: white;
  align-self: flex-end;
}
.other {
  background: #eee;
  color: #222;
  align-self: flex-start;
}
.input-area {
  display: flex;
  padding: 12px;
  gap: 8px;
  border-top: 1px solid #ddd;
}
input {
  flex: 1;
  min-width: 0;
  padding: 13px;
  border: 1px solid #ddd;
  border-radius: 20px;
  outline: none;
}
button {
  border: none;
  background: #8b5cf6;
  color: white;
  padding: 12px 17px;
  border-radius: 20px;
  cursor: pointer;
}
button:hover {
  background: #6d28d9;
}
</style>
</head>
<body>

<div class="chat">
  <header>💜 Мій чат</header>

  <div id="messages">
    <div class="message other">
      Привіт! Ласкаво просимо в чат 😊
    </div>
  </div>

  <div class="input-area">
    <input id="msg" placeholder="Напиши повідомлення...">
    <button onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
function sendMessage() {
  const input = document.getElementById("msg");
  const text = input.value.trim();

  if (!text) return;

  const messages = document.getElementById("messages");
  const message = document.createElement("div");

  message.className = "message me";
  message.textContent = text;

  messages.appendChild(message);
  input.value = "";
  messages.scrollTop = messages.scrollHeight;
}

document.getElementById("msg").addEventListener("keydown", e => {
  if (e.key === "Enter") sendMessage();
});
</script>

</body>
</html>
